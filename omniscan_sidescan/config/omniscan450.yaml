# Parameters for the Omniscan 450 side scan sonar nodes.
#
# Load with:
#   ros2 run omniscan_sidescan sidescansonarall_node \
#     --ros-args --params-file <this file>
#
# The node name key has to match the node's name, which the launch files set
# from sensor_number: omniscan450 for the two-sonar node, omniscan450all for
# the four-sonar node.  Use /** to apply to whichever one is running.
/**:
  ros__parameters:
    # Addresses of the sonars on the vehicle network.  Read-only: change them
    # here or on the command line, not at run time.
    port_ip_address: "192.168.2.94"
    port_port: 51200
    port_frame_id: "sonar_port"
    starboard_ip_address: "192.168.2.95"
    starboard_port: 51200
    starboard_frame_id: "sonar_starboard"
    # Only used by the four-sonar node.
    bow_ip_address: "192.168.2.93"
    bow_port: 51200
    bow_frame_id: "sonar_bow"
    stern_ip_address: "192.168.2.92"
    stern_port: 51200
    stern_frame_id: "sonar_stern"

    frame_id: "sonar"
    # Opt in only when all heads share a subnet and UDP 51201 is available.
    # Assignments are read back; physical acoustic timing needs hardware validation.
    sync_enabled: false
    # Connection and recovery are independent for each sonar.
    connect_timeout: 5.0
    # Deadline for device information and profile configuration confirmation.
    configuration_timeout: 2.0
    # Seconds to wait for a profile from each sonar before reporting a miss.
    read_timeout: 0.5
    # Reconnect only this channel after this many failures; 0 disables the limit.
    max_consecutive_failures: 10
    reconnect_initial_delay: 0.25
    reconnect_max_delay: 10.0
    # Based on host receive times, without assuming synchronized device clocks.
    max_profile_age: 0.5
    max_profile_skew: 0.05

    # Tunables; these can be changed while the node runs with
    # `ros2 param set`. Each worker confirms settings independently; inspect
    # diagnostics for desired/applied generations and device rejection errors.
    speed_of_sound_mm: 1482000    # 1482000 - 1500000
    start_mm: 0                   # 0 - 5000
    length_mm: 6000               # 1 - 300000
    msec_per_ping: 0              # uint32 ms; 100 = 10 Hz, 0 = fastest
    # read_timeout and configuration_timeout must exceed msec_per_ping / 1000.
    pulse_len_percent: 0.002      # 0.002 - 0.004
    filter_duration_percent: 0.0015   # 0.0015 - 0.0016
    gain_index: -1                # -1 for auto gain, otherwise 0 - 7
    num_results: 600              # 200 - 1200
